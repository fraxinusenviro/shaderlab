name: Build, test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deployments via the official artifact flow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # configure-pages reports "/<repo>" for project sites and "" for custom
      # domains; Vite needs a trailing slash.
      - name: Resolve base path
        id: base
        run: echo "path=${PAGES_BASE_PATH:-/${REPO_NAME}}/" >> "$GITHUB_OUTPUT"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: TypeScript validation
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests (against the production build at the Pages base path)
        run: npm run test:e2e
        env:
          CI: 'true'
          BASE_PATH: ${{ steps.base.outputs.path }}
          E2E_BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
